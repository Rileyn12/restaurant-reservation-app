<!DOCTYPE html>
<html>
    <head>
        <h1 align="center">Restaurant Reservation Login</h1>
        <style>
            .button {
              border: 1px;
              color: white;
              width: 15%;
              padding: 15px 32px;
              text-align: center;
              text-decoration: none;
              display: block;
              font-size: 16px;
              margin: 2px auto;
              cursor: pointer;
            }
            
            .button1 {background-color: #04AA6D;} /* Green */
            .button2 {background-color: #008CBA;} /* Blue */
        </style>
    </head>
    <body>
        <form method="GET" action="/employeeLogin">
            <button class="button button1">Employee Login</button>
        </form>
        <form method="GET" action="/makeReservation">
            <button class="button button2">Guest Login</button>
        </form>
    </body>
</html>
